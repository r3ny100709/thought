<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thought</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Itim&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#f7c9d9;
  --pink-light:#fde8f0;
  --pink-soft:#fff2f7;
  --pink-deep:#e99ab8;
  --rose:#d9789c;
  --white:#ffffff;
  --text:#8d6474;
  --text-dark:#744d5d;
  --shadow:rgba(190,110,140,.18);
}
*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  min-height:100vh;
  font-family:
    "Baloo 2",
    "Itim",
    "Sarabun",
    sans-serif;
  color:var(--text);
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(255,255,255,.85),
      transparent 25%
    ),
    radial-gradient(
      circle at 90% 30%,
      rgba(255,255,255,.65),
      transparent 22%
    ),
    linear-gradient(
      135deg,
      #f9dce7 0%,
      #fcebf2 45%,
      #f7d3e1 100%
    );
  overflow-x:hidden;
}
/* ==================================================
   DECORATION
================================================== */
.decoration{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.flower{
  position:absolute;
  color:rgba(255,255,255,.72);
  font-family:"Arial",sans-serif;
  filter:
    drop-shadow(0 3px 8px rgba(210,120,150,.15));
  user-select:none;
}
.flower.f1{
  top:8%;
  left:2%;
  font-size:42px;
  transform:rotate(-15deg);
}
.flower.f2{
  top:32%;
  right:2%;
  font-size:34px;
  transform:rotate(18deg);
}
.flower.f3{
  bottom:8%;
  left:4%;
  font-size:31px;
  transform:rotate(12deg);
}
.flower.f4{
  bottom:17%;
  right:4%;
  font-size:44px;
  transform:rotate(-18deg);
}
.sparkle{
  position:absolute;
  color:#ffffff;
  opacity:.75;
  text-shadow:
    0 0 8px rgba(255,255,255,.8);
}
.sparkle.s1{
  top:16%;
  left:15%;
}
.sparkle.s2{
  top:43%;
  right:12%;
}
.sparkle.s3{
  bottom:13%;
  right:20%;
}
.sparkle.s4{
  bottom:30%;
  left:12%;
}
/* ==================================================
   MAIN
================================================== */
.page{
  position:relative;
  z-index:1;
  width:min(1180px,100%);
  margin:0 auto;
  padding:
    22px
    22px
    60px;
}
/* ==================================================
   TOP VIDEO BANNER
================================================== */
.banner{
  position:relative;
  width:100%;
  height:245px;
  border-radius:30px;
  overflow:hidden;
  background:#f3c3d5;
  box-shadow:
    0 12px 35px var(--shadow),
    0 0 0 7px rgba(255,255,255,.42);
}
.banner::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.03),
      rgba(255,205,224,.08)
    );
  pointer-events:none;
}
.banner video{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  pointer-events:none;
  user-select:none;
  filter:
    saturate(.9)
    brightness(1.04);
}
/* ==================================================
   BOW ON BANNER
================================================== */
.banner-bow{
  position:absolute;
  right:28px;
  bottom:-4px;
  z-index:5;
  width:78px;
  height:58px;
  pointer-events:none;
}
.banner-bow::before,
.banner-bow::after{
  content:"";
  position:absolute;
  top:10px;
  width:38px;
  height:38px;
  background:
    linear-gradient(
      135deg,
      #fff7fa,
      #f1b6cc
    );
  border:2px solid rgba(255,255,255,.9);
  box-shadow:
    0 5px 12px rgba(190,100,130,.16);
}
.banner-bow::before{
  left:0;
  border-radius:
    70% 30% 65% 35%;
  transform:rotate(-22deg);
}
.banner-bow::after{
  right:0;
  border-radius:
    30% 70% 35% 65%;
  transform:rotate(22deg);
}
.banner-bow{
  background:
    radial-gradient(
      circle at center,
      #fff8fb 0 7px,
      #eaa0bb 8px 13px,
      transparent 14px
    );
}
/* ==================================================
   MAIN AREA
================================================== */
.main-area{
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  gap:28px;
  align-items:start;
  margin-top:30px;
}
/* ==================================================
   PROFILE
================================================== */
.profile{
  position:relative;
  padding:25px 18px 28px;
  text-align:center;
  background:
    rgba(255,255,255,.45);
  border-radius:28px;
  box-shadow:
    0 10px 30px rgba(190,110,140,.12);
  backdrop-filter:blur(8px);
}
.profile-bow{
  position:absolute;
  top:-20px;
  left:50%;
  width:72px;
  height:52px;
  transform:translateX(-50%);
  z-index:3;
}
.profile-bow::before,
.profile-bow::after{
  content:"";
  position:absolute;
  top:5px;
  width:36px;
  height:36px;
  background:
    linear-gradient(
      135deg,
      #ffffff,
      #efaec7
    );
  border:2px solid #ffffff;
  box-shadow:
    0 5px 12px rgba(180,100,130,.13);
}
.profile-bow::before{
  left:0;
  border-radius:
    70% 30% 65% 35%;
  transform:rotate(-22deg);
}
.profile-bow::after{
  right:0;
  border-radius:
    30% 70% 35% 65%;
  transform:rotate(22deg);
}
.profile-bow{
  background:
    radial-gradient(
      circle at center,
      #fff 0 7px,
      #e28eaf 8px 13px,
      transparent 14px
    );
}
.profile-image{
  width:155px;
  height:155px;
  margin:5px auto 16px;
  display:block;
  border-radius:50%;
  object-fit:cover;
  border:
    7px solid rgba(255,255,255,.9);
  box-shadow:
    0 8px 25px rgba(190,100,135,.2),
    0 0 0 3px #efb4ca;
}
.profile-name{
  margin:0;
  color:#ffffff;
  font-size:1.55rem;
  font-weight:700;
  letter-spacing:.5px;
  text-shadow:
    0 2px 5px rgba(170,90,120,.28);
}
/* ==================================================
   MINI SPOTIFY PLAYER
================================================== */
.music-player{
  position:relative;
  width:100%;
  margin:13px auto 0;
  padding:7px;
  background:
    rgba(255,255,255,.52);
  border-radius:18px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.65),
    0 7px 18px rgba(190,110,140,.10);
  overflow:hidden;
}
/* เส้นเพลงด้านบน */
.music-wave{
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  margin:0 7px 5px;
  opacity:.72;
}
.music-wave span{
  display:block;
  width:2px;
  border-radius:5px;
  background:#d98aa7;
  animation:wave 1.1s ease-in-out infinite;
}
.music-wave span:nth-child(1){height:6px;animation-delay:.05s}
.music-wave span:nth-child(2){height:12px;animation-delay:.12s}
.music-wave span:nth-child(3){height:8px;animation-delay:.18s}
.music-wave span:nth-child(4){height:16px;animation-delay:.25s}
.music-wave span:nth-child(5){height:10px;animation-delay:.32s}
.music-wave span:nth-child(6){height:18px;animation-delay:.39s}
.music-wave span:nth-child(7){height:9px;animation-delay:.46s}
.music-wave span:nth-child(8){height:14px;animation-delay:.53s}
.music-wave span:nth-child(9){height:7px;animation-delay:.60s}
.music-wave span:nth-child(10){height:17px;animation-delay:.67s}
.music-wave span:nth-child(11){height:10px;animation-delay:.74s}
.music-wave span:nth-child(12){height:6px;animation-delay:.81s}
.music-wave span:nth-child(13){height:13px;animation-delay:.88s}
.music-wave span:nth-child(14){height:8px;animation-delay:.95s}
.music-wave span:nth-child(15){height:15px;animation-delay:1.02s}
@keyframes wave{
  0%,100%{
    transform:scaleY(.55);
    opacity:.45;
  }
  50%{
    transform:scaleY(1);
    opacity:1;
  }
}
/* Spotify จริง */
.spotify-frame{
  display:block;
  width:100%;
  height:152px;
  border:0;
  border-radius:12px;
}
/* ==================================================
   FLOWER DIVIDER
================================================== */
.flower-divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:20px auto 0;
  color:#e59bb5;
  font-size:17px;
}
.flower-divider::before,
.flower-divider::after{
  content:"";
  width:35px;
  height:1px;
  background:
    linear-gradient(
      to right,
      transparent,
      #eab3c7
    );
}
.flower-divider::after{
  background:
    linear-gradient(
      to left,
      transparent,
      #eab3c7
    );
}
/* ==================================================
   THOUGHT CONTENT
================================================== */
.thought-content{
  position:relative;
  min-width:0;
  min-height:300px;
  padding:35px 40px 45px;
  background:#ffffff;
  border-radius:30px;
  box-shadow:
    0 12px 35px rgba(190,110,140,.12);
}
.thought-content::before{
  content:"✿";
  position:absolute;
  top:18px;
  right:25px;
  color:#f0b5ca;
  font-size:28px;
  transform:rotate(15deg);
}
.thought-title{
  margin:0;
  color:#d9799d;
  font-family:"Itim","Baloo 2",sans-serif;
  font-size:2.35rem;
  font-weight:400;
  letter-spacing:1px;
}
.thought-title::after{
  content:"";
  display:block;
  width:70px;
  height:3px;
  margin-top:10px;
  border-radius:10px;
  background:
    linear-gradient(
      to right,
      #eca8c2,
      #f8dce7
    );
}
/* ==================================================
   PINK MESSAGE BOX
================================================== */
.thought-card{
  position:relative;
  margin-top:28px;
  padding:24px 26px;
  background:
    linear-gradient(
      135deg,
      #fff2f7,
      #fde5ef
    );
  border-radius:22px;
  box-shadow:
    inset 0 0 0 1px rgba(246,194,212,.22),
    0 8px 22px rgba(190,110,140,.08);
}
.thought-card::before{
  content:"🌸";
  position:absolute;
  top:13px;
  right:18px;
  font-size:20px;
  opacity:.7;
}
.thought-card-text{
  margin:0;
  color:#a66f83;
  font-family:
    "Itim",
    "Baloo 2",
    sans-serif;
  font-size:1.05rem;
  line-height:1.9;
}
/* ==================================================
   MOBILE
================================================== */
@media(max-width:760px){
  .page{
    padding:
      14px
      14px
      40px;
  }
  .banner{
    height:175px;
    border-radius:22px;
  }
  .banner-bow{
    right:15px;
    transform:scale(.8);
    transform-origin:bottom right;
  }
  .main-area{
    grid-template-columns:1fr;
    gap:20px;
    margin-top:25px;
  }
  .profile{
    width:100%;
    padding:27px 20px 25px;
  }
  .profile-image{
    width:135px;
    height:135px;
  }
  .spotify-frame{
    height:152px;
  }
  .thought-content{
    padding:
      28px
      22px
      35px;
    min-height:300px;
    border-radius:24px;
  }
  .thought-title{
    font-size:2rem;
  }
  .thought-card{
    padding:21px 20px;
  }
  .flower.f1{
    font-size:30px;
  }
  .flower.f2{
    font-size:26px;
  }
  .flower.f3{
    font-size:25px;
  }
  .flower.f4{
    font-size:30px;
  }
}
@media(max-width:400px){
  .banner{
    height:145px;
  }
  .thought-content{
    padding:
      25px
      18px
      30px;
    min-height:280px;
  }
  .music-player{
    padding:6px;
  }
  .music-wave{
    margin-bottom:4px;
  }
  .spotify-frame{
    height:152px;
  }
}
</style>
</head>
<body>
<!-- ==================================================
     BACKGROUND DECORATION
================================================== -->
<div class="decoration">

✿
❀
✿
❁

✦
✧
✦
✧

</div>
<!-- ==================================================
     PAGE
================================================== -->
<main class="page">
  <!-- ==================================================
       TOP VIDEO
  ================================================== -->
  <div class="banner">
<video
  id="thoughtVideo"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  disablepictureinpicture
  disableremoteplayback
  controlslist="nodownload nofullscreen noremoteplayback"
  tabindex="-1"
>
  <source
    src="./snaptik_7635695229902802198_v3.mp4"
    type="video/mp4"
  >
</video>
<div class="banner-bow"></div>
  </div>
  <!-- ==================================================
       PROFILE + CONTENT
  ================================================== -->
  <div class="main-area">
<!-- ==================================================
     PROFILE
================================================== -->
<aside class="profile">
  <div class="profile-bow"></div>
  <img
    class="profile-image"
    src="./IMG_7790.jpeg"
    alt="Profile"
  >
  <h1 class="profile-name">
    Mizuki
  </h1>
  <!-- ==================================================
       SPOTIFY PLAYLIST
  ================================================== -->
  <div class="music-player">
    <div class="music-wave" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <iframe
      class="spotify-frame"
      src="https://open.spotify.com/embed/playlist/4TpVXAQdCxZfZNg83WA52t?utm_source=generator"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
      title="Mizuki Spotify Playlist"
    ></iframe>
  </div>
  <div class="flower-divider">
    ✿ ♡ ✿
  </div>
</aside>
<!-- ==================================================
     CONTENT
================================================== -->
<section class="thought-content">
  <h2 class="thought-title">
    kllurself.ut
  </h2>
  <!-- PINK MESSAGE -->
  <article class="thought-card">
    <p class="thought-card-text">
      Do you miss me Linda?
    </p>
  </article>
</section>
  </div>
</main>
<script>
/* ==================================================
   VIDEO
================================================== */
const video =
  document.getElementById("thoughtVideo");
function keepVideoPlaying(){
  if(video.paused){
    video.play().catch(()=>{});
  }
}
video.addEventListener(
  "pause",
  keepVideoPlaying
);
video.addEventListener(
  "ended",
  () => {
    video.currentTime = 0;
    keepVideoPlaying();
  }
);
video.play().catch(()=>{});
setInterval(
  keepVideoPlaying,
  500
);
</script>
</body>
</html>
