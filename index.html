<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Mizuki</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Itim&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  background:#f8dce8;

  color:#765565;

  font-family:
    'Baloo 2',
    'Itim',
    sans-serif;

  overflow-x:hidden;

}


/* =====================================================
   DECORATIONS
===================================================== */

.flower{

  position:fixed;

  pointer-events:none;

  z-index:0;

  opacity:.45;

  font-size:27px;

}

.flower.one{
  top:6%;
  left:3%;
}

.flower.two{
  top:35%;
  right:3%;
}

.flower.three{
  bottom:13%;
  left:4%;
}

.flower.four{
  bottom:4%;
  right:5%;
}


/* =====================================================
   PAGE
===================================================== */

.page{

  position:relative;

  z-index:1;

  width:100%;

  max-width:900px;

  margin:0 auto;

  padding:
    0
    0
    45px;

}


/* =====================================================
   VIDEO
===================================================== */

.video-box{

  width:100%;

  height:240px;

  overflow:hidden;

  background:#fff;

  border-radius:
    0
    0
    28px
    28px;

  box-shadow:
    0 10px 30px
    rgba(153,87,115,.18);

}


.video-box video{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-user-drag:none;

}


/* =====================================================
   TWO MAIN BOXES
===================================================== */

.workspace{

  display:grid;

  grid-template-columns:
    240px
    minmax(0,1fr);

  gap:15px;

  padding:
    16px;

}


/* =====================================================
   LARGE PROFILE BOX
===================================================== */

.profile-box{

  min-height:430px;

  padding:
    24px
    18px;

  background:#fff;

  border-radius:28px;

  box-shadow:
    0 9px 30px
    rgba(145,79,108,.14);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

}


.profile-image-large{

  width:155px;

  height:155px;

  object-fit:cover;

  border-radius:50%;

  border:
    5px solid
    #fff;

  box-shadow:
    0 8px 25px
    rgba(145,79,108,.22);

}


.profile-name-large{

  margin:
    17px 0 0;

  color:#765064;

  font-size:2rem;

  line-height:1;

  font-weight:700;

}


.profile-ig-large{

  margin:
    8px 0 0;

  color:#ad788d;

  font-family:
    'Itim',
    sans-serif;

  font-size:.9rem;

}


/* =====================================================
   CHAT BOX
===================================================== */

.chat-box{

  min-height:430px;

  padding:
    18px;

  background:#fff;

  border-radius:28px;

  box-shadow:
    0 9px 30px
    rgba(145,79,108,.14);

  display:flex;

  flex-direction:column;

  min-width:0;

}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-profile{

  display:flex;

  align-items:center;

  gap:10px;

  padding-bottom:13px;

  border-bottom:
    1px solid
    #f2d8e3;

}


.chat-profile-image{

  width:45px;

  height:45px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    #fff;

  box-shadow:
    0 3px 10px
    rgba(145,79,108,.16);

}


.chat-profile-info{

  min-width:0;

}


.chat-profile-name{

  margin:0;

  color:#765064;

  font-size:1.08rem;

  font-weight:700;

  line-height:1;

}


.chat-profile-ig{

  margin:
    3px 0 0;

  color:#b18395;

  font-family:
    'Itim',
    sans-serif;

  font-size:.72rem;

}


/* =====================================================
   MESSAGES
===================================================== */

#thoughts{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  gap:13px;

  flex:1;

  min-width:0;

  padding-top:16px;

}


/* =====================================================
   MESSAGE ROW
   รูปโปรไฟล์ + bubble
===================================================== */

.message-row{

  display:flex;

  align-items:flex-end;

  gap:8px;

  width:100%;

  min-width:0;

}


/* =====================================================
   SMALL PROFILE BESIDE EACH MESSAGE
===================================================== */

.message-avatar{

  width:34px;

  height:34px;

  flex-shrink:0;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    #fff;

  box-shadow:
    0 3px 8px
    rgba(145,79,108,.15);

}


/* =====================================================
   MESSAGE BUBBLE
===================================================== */

.thought-card{

  position:relative;

  width:fit-content;

  max-width:calc(100% - 42px);

  padding:
    9px
    13px;

  background:#f9d9e7;

  border:
    1px solid
    #efbfd2;

  border-radius:
    7px
    17px
    17px
    17px;

  color:#765565;

  font-family:
    'Itim',
    'Baloo 2',
    sans-serif;

  font-size:1.04rem;

  line-height:1.5;

  word-break:break-word;

  white-space:pre-wrap;

  box-shadow:
    0 3px 9px
    rgba(180,95,130,.07);

}


/* =====================================================
   CHAT TAIL
===================================================== */

.thought-card::before{

  content:"";

  position:absolute;

  top:-1px;

  left:-6px;

  width:10px;

  height:10px;

  background:#f9d9e7;

  border-left:
    1px solid
    #efbfd2;

  transform:
    skewX(-28deg);

}


/* =====================================================
   DATE
===================================================== */

.post-date{

  display:block;

  margin-top:3px;

  color:#bd8da0;

  font-family:
    'Baloo 2',
    sans-serif;

  font-size:.6rem;

  text-align:right;

  opacity:.6;

}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading,
.empty{

  width:100%;

  padding:
    20px
    4px;

  text-align:center;

  color:#b78396;

  font-family:
    'Itim',
    sans-serif;

  font-size:.95rem;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:620px){

  .page{

    padding-bottom:30px;

  }


  .video-box{

    height:210px;

    border-radius:
      0
      0
      23px
      23px;

  }


  .workspace{

    grid-template-columns:1fr;

    gap:12px;

    padding:
      12px 9px;

  }


  .profile-box{

    min-height:205px;

    padding:18px;

    flex-direction:row;

    justify-content:flex-start;

    gap:16px;

    text-align:left;

  }


  .profile-image-large{

    width:105px;

    height:105px;

  }


  .profile-name-large{

    margin:0;

    font-size:1.65rem;

  }


  .profile-ig-large{

    margin-top:7px;

    font-size:.78rem;

  }


  .chat-box{

    min-height:380px;

    padding:15px;

  }


  .message-avatar{

    width:31px;

    height:31px;

  }


  .thought-card{

    max-width:calc(100% - 40px);

    font-size:1rem;

  }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media(max-width:380px){

  .video-box{

    height:180px;

  }


  .profile-box{

    min-height:180px;

  }


  .profile-image-large{

    width:85px;

    height:85px;

  }


  .profile-name-large{

    font-size:1.45rem;

  }


  .profile-ig-large{

    font-size:.7rem;

  }


  .chat-box{

    min-height:350px;

  }


  .thought-card{

    font-size:.92rem;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *{

    scroll-behavior:auto !important;

    transition:none !important;

    animation:none !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     DECORATIONS
===================================================== -->

<div class="flower one">🌷</div>
<div class="flower two">🌸</div>
<div class="flower three">🎀</div>
<div class="flower four">🌷</div>


<main class="page">


  <!-- ===================================================
       VIDEO
  ==================================================== -->

  <div class="video-box">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      controlslist="nodownload nofullscreen noremoteplayback"
      tabindex="-1"
    >

      <source
        src="./snaptik_7635695229902802198_v3.mp4"
        type="video/mp4"
      >

    </video>

  </div>


  <!-- ===================================================
       MAIN WORKSPACE
  ==================================================== -->

  <section class="workspace">


    <!-- ===============================================
         LARGE PROFILE BOX
    ================================================ -->

    <aside class="profile-box">

      <img
        class="profile-image-large"
        src="./IMG_7790.jpeg"
        alt="Mizuki"
      >

      <div>

        <h1 class="profile-name-large">
          Mizuki
        </h1>

        <p class="profile-ig-large">
          IG: kllurself.ut
        </p>

      </div>

    </aside>


    <!-- ===============================================
         CHAT BOX
    ================================================ -->

    <section class="chat-box">


      <!-- CHAT HEADER -->

      <div class="chat-profile">

        <img
          class="chat-profile-image"
          src="./IMG_7790.jpeg"
          alt="Mizuki"
        >

        <div class="chat-profile-info">

          <p class="chat-profile-name">
            Mizuki
          </p>

          <p class="chat-profile-ig">
            kllurself.ut
          </p>

        </div>

      </div>


      <!-- FIREBASE MESSAGES -->

      <div id="thoughts">

        <div class="loading">
          loading... ♡
        </div>

      </div>


    </section>


  </section>


</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
  initializeApp
}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDL5KlmnirvhpTr6rhnKRKpQncRl6gfLXk",

  authDomain:
    "rainyren-4f684.firebaseapp.com",

  projectId:
    "rainyren-4f684",

  storageBucket:
    "rainyren-4f684.appspot.com",

  messagingSenderId:
    "804536782078",

  appId:
    "1:804536782078:web:f70657a0abaa9809e169af",

  measurementId:
    "G-KWQS2SQ308"

};


/* =====================================================
   FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   POSTS
===================================================== */

const thoughts =
  document.getElementById('thoughts');


/* =====================================================
   DATE
===================================================== */

function formatDate(timestamp){

  if(!timestamp){
    return '';
  }

  const date =
    timestamp.toDate();

  return date.toLocaleString(
    'th-TH',
    {
      year:'numeric',
      month:'short',
      day:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* =====================================================
   CREATE MESSAGE
===================================================== */

function createPost(post){

  /* แถวของข้อความ */

  const row =
    document.createElement('div');

  row.className =
    'message-row';


  /* รูปโปรไฟล์เล็ก */

  const avatar =
    document.createElement('img');

  avatar.className =
    'message-avatar';

  avatar.src =
    './IMG_7790.jpeg';

  avatar.alt =
    'Mizuki';


  /* กล่องข้อความ */

  const card =
    document.createElement('article');

  card.className =
    'thought-card';


  const text =
    document.createElement('div');

  text.textContent =
    post.text || '';


  card.appendChild(text);


  /* วันที่ */

  if(post.createdAt){

    const date =
      document.createElement('span');

    date.className =
      'post-date';

    date.textContent =
      formatDate(post.createdAt);

    card.appendChild(date);

  }


  row.appendChild(avatar);

  row.appendChild(card);


  return row;

}


/* =====================================================
   REALTIME FIRESTORE
===================================================== */

const postsQuery =
  query(
    collection(db,'thoughts'),
    orderBy('createdAt','desc')
  );


onSnapshot(

  postsQuery,

  (snapshot) => {

    thoughts.innerHTML = '';


    if(snapshot.empty){

      const empty =
        document.createElement('div');

      empty.className =
        'empty';

      empty.textContent =
        'ยังไม่มีข้อความ ♡';

      thoughts.appendChild(empty);

      return;

    }


    snapshot.forEach(
      (doc) => {

        thoughts.appendChild(
          createPost(doc.data())
        );

      }
    );

  },


  (error) => {

    console.error(
      'Firestore error:',
      error
    );


    thoughts.innerHTML = '';


    const errorMessage =
      document.createElement('div');

    errorMessage.className =
      'empty';

    errorMessage.textContent =
      'ไม่สามารถโหลดข้อความได้ ♡';

    thoughts.appendChild(
      errorMessage
    );

  }

);


/* =====================================================
   VIDEO
===================================================== */

const video =
  document.querySelector(
    '.video-box video'
  );


function keepVideoPlaying(){

  if(video && video.paused){

    video.play().catch(
      () => {}
    );

  }

}


if(video){

  video.addEventListener(
    'pause',
    keepVideoPlaying
  );


  video.addEventListener(
    'ended',
    () => {

      video.currentTime = 0;

      keepVideoPlaying();

    }
  );


  video.play().catch(
    () => {}
  );

}

</script>


</body>

</html>
