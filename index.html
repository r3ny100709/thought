<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Thought</title>

<link
  href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  background:#f8dce7;

  color:#5c4050;

  font-family:
    'Mali',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  overflow-x:hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page{

  width:100%;

  min-height:100vh;

  margin:0;

  padding:0;

}


/* =====================================================
   VIDEO
===================================================== */

.video-box{

  width:100%;

  margin:0;

  padding:0;

  overflow:hidden;

  background:#000;

  border-radius:
    0 0 18px 18px;

}


.video-box video{

  display:block;

  width:100%;

  height:240px;

  object-fit:cover;

  border:0;

  border-radius:
    0 0 18px 18px;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-user-drag:none;
}


/* =====================================================
   WORKSPACE
===================================================== */

.workspace{

  width:100%;

  display:grid;

  grid-template-columns:
    240px
    minmax(0,1fr);

  gap:16px;

  padding:16px;

}


/* =====================================================
   PROFILE BOX
===================================================== */

.profile-box{

  width:100%;

  min-height:430px;

  padding:28px 18px;

  background:#fff;

  border-radius:24px;

  border:
    1px solid
    rgba(240,145,175,.35);

  box-shadow:
    0 8px 25px
    rgba(145,70,100,.08);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:flex-start;

  text-align:center;
}


.profile-box img{

  width:155px;

  height:155px;

  object-fit:cover;

  border-radius:50%;

  margin-bottom:18px;

  border:
    5px solid
    #f8dce7;

  box-shadow:
    0 5px 18px
    rgba(200,100,140,.18);
}


.profile-box h1{

  margin:0 0 5px;

  font-size:1.7rem;

  font-weight:700;

  color:#654354;
}


.profile-box .ig{

  margin:0;

  font-size:.9rem;

  color:#ad7d91;
}


/* =====================================================
   CHAT BOX
===================================================== */

.chat-box{

  width:100%;

  min-height:430px;

  background:#fff;

  border-radius:24px;

  border:
    1px solid
    rgba(240,145,175,.35);

  box-shadow:
    0 8px 25px
    rgba(145,70,100,.08);

  overflow:hidden;

  display:flex;

  flex-direction:column;
}


/* =====================================================
   CHAT HEADER
===================================================== */

.chat-header{

  display:flex;

  align-items:center;

  gap:10px;

  padding:16px 20px;

  border-bottom:
    1px solid
    #f5dbe4;

  background:#fff;
}


.chat-header img{

  width:42px;

  height:42px;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    #f4c5d5;
}


.chat-header-text{

  display:flex;

  flex-direction:column;

  line-height:1.25;
}


.chat-header-text strong{

  font-size:1rem;

  color:#624354;
}


.chat-header-text span{

  font-size:.75rem;

  color:#b28a9a;
}


/* =====================================================
   THOUGHTS AREA
===================================================== */

#thoughts{

  flex:1;

  padding:20px;

  display:flex;

  flex-direction:column;

  gap:18px;

  overflow-y:auto;
}


/* =====================================================
   MESSAGE ROW
===================================================== */

.message-row{

  display:flex;

  align-items:flex-start;

  gap:9px;

  width:100%;
}


/* =====================================================
   MESSAGE AVATAR
===================================================== */

.message-avatar{

  flex:
    0 0 34px;

  width:34px;

  height:34px;

  margin-top:3px;

  object-fit:cover;

  border-radius:50%;

  border:
    2px solid
    #f4c5d5;

  box-shadow:
    0 2px 6px
    rgba(180,90,125,.12);
}


/* =====================================================
   THOUGHT CARD
===================================================== */

.thought-card{

  position:relative;

  max-width:
    min(78%, 620px);

  padding:
    13px
    16px
    10px;

  background:#f8dce7;

  border:
    1px solid
    #efbfd0;

  border-radius:
    4px
    18px
    18px
    18px;

  color:#624354;

  font-size:.95rem;

  line-height:1.65;

  word-break:break-word;

  box-shadow:
    0 3px 10px
    rgba(180,90,125,.06);
}


/* =====================================================
   CHAT BUBBLE TAIL
===================================================== */

.thought-card::before{

  content:"";

  position:absolute;

  left:-7px;

  top:10px;

  width:13px;

  height:13px;

  background:#f8dce7;

  border-left:
    1px solid
    #efbfd0;

  border-bottom:
    1px solid
    #efbfd0;

  transform:
    rotate(45deg);
}


/* =====================================================
   DATE
===================================================== */

.thought-date{

  display:block;

  margin-top:7px;

  font-size:.68rem;

  color:#b78b9c;

  text-align:right;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

  width:100%;

  padding:35px 15px;

  text-align:center;

  color:#c09aaa;

  font-size:.9rem;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:700px){

  .video-box{

    border-radius:
      0 0 14px 14px;

  }

  .video-box video{

    height:210px;

    border-radius:
      0 0 14px 14px;

  }


  .workspace{

    display:flex;

    flex-direction:column;

    gap:14px;

    padding:14px;

  }


  .profile-box{

    min-height:auto;

    padding:25px 18px;

  }


  .profile-box img{

    width:135px;

    height:135px;

  }


  .chat-box{

    min-height:500px;

    border-radius:22px;

  }


  #thoughts{

    padding:16px;

  }


  .thought-card{

    max-width:
      calc(100% - 5px);

    font-size:.9rem;

  }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media (max-width:380px){

  .workspace{

    padding:10px;

  }

  .profile-box{

    border-radius:20px;

  }

  .chat-box{

    border-radius:20px;

  }

  #thoughts{

    padding:13px;

  }

}

</style>

</head>


<body>


<main class="page">


  <!-- ===================================================
       VIDEO
  ==================================================== -->

  <div class="video-box">

    <video
      id="thoughtVideo"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      controlslist="nodownload nofullscreen noremoteplayback"
      tabindex="-1"
    >

      <source
        src="./snaptik_7635695229902802198_v3.mp4"
        type="video/mp4"
      >

    </video>

  </div>


  <!-- ===================================================
       PROFILE + CHAT
  ==================================================== -->

  <section class="workspace">


    <!-- =================================================
         PROFILE
    ================================================== -->

    <aside class="profile-box">

      <img
        src="./IMG_7790.jpeg"
        alt="Mizuki"
      >

      <h1>
        Mizuki
      </h1>

      <p class="ig">
        IG: kllurself.ut
      </p>

    </aside>


    <!-- =================================================
         CHAT
    ================================================== -->

    <section class="chat-box">


      <!-- HEADER -->

      <header class="chat-header">

        <img
          src="./IMG_7790.jpeg"
          alt="Mizuki"
        >

        <div class="chat-header-text">

          <strong>
            Mizuki
          </strong>

          <span>
            kllurself.ut
          </span>

        </div>

      </header>


      <!-- FIREBASE MESSAGES -->

      <div id="thoughts">

        <div class="empty">
          Loading...
        </div>

      </div>


    </section>


  </section>


</main>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';


const firebaseConfig = {

  apiKey:
    "AIzaSyDL5KlmnirvhpTr6rhnKRKpQncRl6gfLXk",

  authDomain:
    "rainyren-4f684.firebaseapp.com",

  projectId:
    "rainyren-4f684",

  storageBucket:
    "rainyren-4f684.appspot.com",

  messagingSenderId:
    "804536782078",

  appId:
    "1:804536782078:web:f70657a0abaa9809e169af",

  measurementId:
    "G-KWQS2SQ308"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =====================================================
   THOUGHTS
===================================================== */

const thoughtsBox =
  document.getElementById('thoughts');


const thoughtsQuery =
  query(
    collection(db,'thoughts'),
    orderBy('createdAt','desc')
  );


onSnapshot(
  thoughtsQuery,

  (snapshot) => {

    thoughtsBox.innerHTML = '';


    if(snapshot.empty){

      const empty =
        document.createElement('div');

      empty.className =
        'empty';

      empty.textContent =
        'ยังไม่มีข้อความ';

      thoughtsBox.appendChild(
        empty
      );

      return;

    }


    snapshot.forEach(
      (doc) => {

        const data =
          doc.data();


        /* MESSAGE ROW */

        const row =
          document.createElement('div');

        row.className =
          'message-row';


        /* AVATAR */

        const avatar =
          document.createElement('img');

        avatar.className =
          'message-avatar';

        avatar.src =
          './IMG_7790.jpeg';

        avatar.alt =
          'Mizuki';


        /* BUBBLE */

        const bubble =
          document.createElement('div');

        bubble.className =
          'thought-card';


        bubble.textContent =
          data.text || '';


        /* DATE */

        if(data.createdAt){

          const date =
            data.createdAt
              .toDate()
              .toLocaleString(
                'th-TH',
                {
                  day:'numeric',
                  month:'short',
                  year:'numeric',
                  hour:'2-digit',
                  minute:'2-digit'
                }
              );


          const dateEl =
            document.createElement('span');

          dateEl.className =
            'thought-date';

          dateEl.textContent =
            date;


          bubble.appendChild(
            dateEl
          );

        }


        row.appendChild(
          avatar
        );

        row.appendChild(
          bubble
        );


        thoughtsBox.appendChild(
          row
        );

      }
    );

  },

  (error) => {

    thoughtsBox.innerHTML = '';

    const errorEl =
      document.createElement('div');

    errorEl.className =
      'empty';

    errorEl.textContent =
      'ไม่สามารถโหลดข้อความได้';

    thoughtsBox.appendChild(
      errorEl
    );

    console.error(error);

  }

);


/* =====================================================
   VIDEO
===================================================== */

const video =
  document.getElementById(
    'thoughtVideo'
  );


function keepVideoPlaying(){

  if(video.paused){

    video.play().catch(
      () => {}
    );

  }

}


video.addEventListener(
  'pause',
  keepVideoPlaying
);


video.addEventListener(
  'ended',
  () => {

    video.currentTime = 0;

    keepVideoPlaying();

  }
);


video.play().catch(
  () => {}
);


setInterval(
  keepVideoPlaying,
  1000
);

</script>


</body>

</html>
