<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Mizuki</title>

<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Itim&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  background:#f8dce8;

  color:#765565;

  font-family:
    'Baloo 2',
    'Itim',
    sans-serif;

  overflow-x:hidden;

}


/* =====================================================
   DECORATIONS
===================================================== */

.flower{

  position:fixed;

  pointer-events:none;

  z-index:0;

  opacity:.5;

  font-size:27px;

}

.flower.one{
  top:5%;
  left:4%;
}

.flower.two{
  top:31%;
  right:4%;
}

.flower.three{
  bottom:13%;
  left:5%;
}

.flower.four{
  bottom:4%;
  right:6%;
}


/* =====================================================
   PAGE
===================================================== */

.page{

  position:relative;

  z-index:1;

  width:100%;

  max-width:760px;

  margin:0 auto;

  padding:
    12px
    10px
    45px;

}


/* =====================================================
   VIDEO
   กว้างเต็ม แต่เตี้ย
===================================================== */

.video-box{

  width:100%;

  height:145px;

  overflow:hidden;

  border-radius:24px;

  background:#fff;

  border:
    3px solid
    rgba(255,255,255,.95);

  box-shadow:
    0 8px 25px
    rgba(153,87,115,.16);

}


.video-box video{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;

  -webkit-touch-callout:none;

  -webkit-user-drag:none;

}


/* =====================================================
   WHITE MAIN BOX
===================================================== */

.content{

  width:100%;

  margin-top:14px;

  padding:
    20px;

  background:#ffffff;

  border-radius:28px;

  box-shadow:
    0 10px 35px
    rgba(145,79,108,.14);

}


/* =====================================================
   PROFILE + THOUGHTS
===================================================== */

.main-layout{

  display:grid;

  grid-template-columns:
    125px
    minmax(0,1fr);

  gap:20px;

  align-items:start;

}


/* =====================================================
   PROFILE — LEFT
===================================================== */

.profile{

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

}


.profile-image{

  width:92px;

  height:92px;

  border-radius:50%;

  object-fit:cover;

  border:
    4px solid
    #fff;

  box-shadow:
    0 6px 20px
    rgba(145,79,108,.2);

}


.profile-name{

  margin:
    9px 0 0;

  color:#765064;

  font-size:1.55rem;

  line-height:1;

  font-weight:700;

}


.profile-ig{

  margin:
    5px 0 0;

  color:#ad788d;

  font-family:
    'Itim',
    sans-serif;

  font-size:.78rem;

  line-height:1.1;

  white-space:nowrap;

}


/* =====================================================
   THOUGHTS — RIGHT
===================================================== */

#thoughts{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  gap:10px;

  min-width:0;

}


/* =====================================================
   PINK THOUGHT BOX
===================================================== */

.thought-card{

  display:block;

  width:fit-content;

  max-width:100%;

  padding:
    10px
    14px;

  background:#f9d9e7;

  border:
    1px solid
    #efbfd2;

  border-radius:15px;

  color:#765565;

  font-family:
    'Itim',
    'Baloo 2',
    sans-serif;

  font-size:1.06rem;

  line-height:1.5;

  text-align:left;

  word-break:break-word;

  white-space:pre-wrap;

  box-shadow:
    0 3px 9px
    rgba(180,95,130,.08);

}


/* =====================================================
   DATE
===================================================== */

.post-date{

  display:block;

  margin-top:3px;

  color:#bd8da0;

  font-family:
    'Baloo 2',
    sans-serif;

  font-size:.63rem;

  text-align:right;

  opacity:.6;

}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.loading,
.empty{

  width:100%;

  padding:
    18px 5px;

  text-align:left;

  color:#b78396;

  font-family:
    'Itim',
    sans-serif;

  font-size:.95rem;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:520px){

  .page{

    padding:
      9px
      8px
      35px;

  }


  /* คลิปกว้างมากและสั้น */

  .video-box{

    height:125px;

    border-radius:21px;

  }


  .content{

    margin-top:11px;

    padding:
      17px
      13px;

    border-radius:24px;

  }


  .main-layout{

    grid-template-columns:
      92px
      minmax(0,1fr);

    gap:13px;

  }


  .profile-image{

    width:76px;

    height:76px;

  }


  .profile-name{

    font-size:1.3rem;

  }


  .profile-ig{

    font-size:.68rem;

  }


  .thought-card{

    padding:
      9px
      12px;

    font-size:.98rem;

    border-radius:14px;

  }

}


/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media(max-width:360px){

  .main-layout{

    grid-template-columns:
      82px
      minmax(0,1fr);

    gap:10px;

  }


  .profile-image{

    width:68px;

    height:68px;

  }


  .profile-name{

    font-size:1.18rem;

  }


  .profile-ig{

    font-size:.61rem;

  }


  .thought-card{

    font-size:.92rem;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     DECORATIONS
===================================================== -->

<div class="flower one">🌷</div>
<div class="flower two">🌸</div>
<div class="flower three">🎀</div>
<div class="flower four">🌷</div>


<main class="page">


  <!-- ===================================================
       VIDEO
  ==================================================== -->

  <div class="video-box">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      disablepictureinpicture
      disableremoteplayback
      controlslist="nodownload nofullscreen noremoteplayback"
      tabindex="-1"
    >

      <source
        src="./snaptik_7635695229902802198_v3.mp4"
        type="video/mp4"
      >

    </video>

  </div>


  <!-- ===================================================
       WHITE CONTENT BOX
  ==================================================== -->

  <section class="content">


    <div class="main-layout">


      <!-- ===============================================
           PROFILE — LEFT
      ================================================ -->

      <aside class="profile">

        <img
          class="profile-image"
          src="./IMG_7790.jpeg"
          alt="Mizuki"
        >

        <h1 class="profile-name">
          Mizuki
        </h1>

        <p class="profile-ig">
          IG: kllurself.ut
        </p>

      </aside>


      <!-- ===============================================
           THOUGHTS — RIGHT
      ================================================ -->

      <div id="thoughts">

        <div class="loading">
          loading... ♡
        </div>

      </div>


    </div>


  </section>


</main>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
  initializeApp
}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
}
from
'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDL5KlmnirvhpTr6rhnKRKpQncRl6gfLXk",

  authDomain:
    "rainyren-4f684.firebaseapp.com",

  projectId:
    "rainyren-4f684",

  storageBucket:
    "rainyren-4f684.appspot.com",

  messagingSenderId:
    "804536782078",

  appId:
    "1:804536782078:web:f70657a0abaa9809e169af",

  measurementId:
    "G-KWQS2SQ308"

};


/* =====================================================
   FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   POSTS
===================================================== */

const thoughts =
  document.getElementById('thoughts');


/* =====================================================
   DATE
===================================================== */

function formatDate(timestamp){

  if(!timestamp){
    return '';
  }

  const date =
    timestamp.toDate();

  return date.toLocaleString(
    'th-TH',
    {
      year:'numeric',
      month:'short',
      day:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* =====================================================
   CREATE POST
===================================================== */

function createPost(post){

  const card =
    document.createElement('article');

  card.className =
    'thought-card';


  const text =
    document.createElement('div');

  text.textContent =
    post.text || '';


  card.appendChild(text);


  if(post.createdAt){

    const date =
      document.createElement('span');

    date.className =
      'post-date';

    date.textContent =
      formatDate(post.createdAt);

    card.appendChild(date);

  }


  return card;

}


/* =====================================================
   REALTIME FIRESTORE
===================================================== */

const postsQuery =
  query(
    collection(db,'thoughts'),
    orderBy('createdAt','desc')
  );


onSnapshot(

  postsQuery,

  (snapshot) => {

    thoughts.innerHTML = '';


    if(snapshot.empty){

      const empty =
        document.createElement('div');

      empty.className =
        'empty';

      empty.textContent =
        'ยังไม่มีข้อความ ♡';

      thoughts.appendChild(empty);

      return;

    }


    snapshot.forEach(
      (doc) => {

        thoughts.appendChild(
          createPost(doc.data())
        );

      }
    );

  },


  (error) => {

    console.error(
      'Firestore error:',
      error
    );


    thoughts.innerHTML = '';


    const errorMessage =
      document.createElement('div');

    errorMessage.className =
      'empty';

    errorMessage.textContent =
      'ไม่สามารถโหลดข้อความได้ ♡';

    thoughts.appendChild(
      errorMessage
    );

  }

);


/* =====================================================
   VIDEO
===================================================== */

const video =
  document.querySelector(
    '.video-box video'
  );


function keepVideoPlaying(){

  if(video && video.paused){

    video.play().catch(
      () => {}
    );

  }

}


if(video){

  video.addEventListener(
    'pause',
    keepVideoPlaying
  );


  video.addEventListener(
    'ended',
    () => {

      video.currentTime = 0;

      keepVideoPlaying();

    }
  );


  video.play().catch(
    () => {}
  );

}

</script>


</body>

</html>
